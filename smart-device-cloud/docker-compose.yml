version: "3.8"

services:
  # PostgreSQL for device registry, workloads, audit logs
  postgres:
    image: postgres:15-alpine
    container_name: smartcloud-postgres
    environment:
      POSTGRES_USER: smartcloud
      POSTGRES_PASSWORD: smartcloud_password
      POSTGRES_DB: smart_device_cloud
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching, telemetry buffer, job queue
  redis:
    image: redis:7-alpine
    container_name: smartcloud-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TimescaleDB for telemetry time-series data
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: smartcloud-timescaledb
    environment:
      POSTGRES_USER: smartcloud
      POSTGRES_PASSWORD: smartcloud_password
      POSTGRES_DB: smart_device_telemetry
    ports:
      - "5433:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./docker/timescaledb-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch for audit log search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: smartcloud-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=changeme
      - xpack.security.enrollment.enabled=true
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://elastic:changeme@localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  timescaledb-data:
  elasticsearch-data:

networks:
  default:
    name: smartcloud-network
