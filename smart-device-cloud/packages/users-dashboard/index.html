<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />

    <title>Dashboard · Smart Device Cloud</title>
    <meta
      name="description"
      content="Real-time fleet operations, device health, workflow orchestration, and AI copilot for Smart Device Cloud."
    />
    <meta name="application-name" content="Smart Device Cloud" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SDC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dashboard · Smart Device Cloud" />
    <meta
      property="og:description"
      content="Real-time fleet operations, device health, and workflow orchestration."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dashboard · Smart Device Cloud" />
    <meta
      name="twitter:description"
      content="Real-time fleet operations, device health, and workflow orchestration."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="./public/kkfarm.svg" />
    <link rel="apple-touch-icon" href="./public/kkfarm.svg" />
    <link rel="mask-icon" href="./public/kkfarm.svg" color="#00e5c0" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!--
      Pre-hydration theme init — runs synchronously before React mounts.
      Reads localStorage('theme') (shadcn convention), falls back to the OS
      preference. Prevents a flash of the wrong theme on first paint.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : prefersDark
                ? 'dark'
                : 'light';

          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.style.colorScheme = theme;

          // Update the theme-color meta to match the resolved theme so the
          // mobile status bar matches the app chrome.
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          if (metas.length) {
            var hex = theme === 'dark' ? '#05060a' : '#f4f6fb';
            metas.forEach(function (m) {
              m.setAttribute('content', hex);
            });
          }
        } catch (_) {
          /* no-op: keep the default <html class="dark"> */
        }
      })();
    </script>

    <!--
      Inline critical CSS for the pre-hydration shell.
      Kept minimal so the browser can paint instantly. The full design
      system (globals.css) is loaded by main.tsx and takes over.
    -->
    <style>
      :root {
        --shell-bg-dark: #05060a;
        --shell-bg-light: #f4f6fb;
        --shell-fg-dark: #e9edf6;
        --shell-fg-light: #0b1020;
        --shell-dim-dark: #8a93a8;
        --shell-dim-light: #5c6478;
        --shell-accent: #00e5c0;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: var(--shell-bg-dark);
        color: var(--shell-fg-dark);
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-size: 14px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      html:not(.dark) body {
        background: var(--shell-bg-light);
        color: var(--shell-fg-light);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      /* ── Pre-hydration splash ────────────────────────────────────
         Shown until React mounts and replaces #root's children.
         Kept visually minimal to feel like the app is already
         loading rather than a separate screen.
         ──────────────────────────────────────────────────────────── */
      #root {
        min-height: 100dvh;
      }

      .pre-boot {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .pre-boot__card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        max-width: 320px;
        text-align: center;
      }

      .pre-boot__logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(
          120deg,
          #00e5c0 0%,
          #5cc8ff 45%,
          #7c5cff 100%
        );
        box-shadow: 0 0 32px -6px rgba(0, 229, 192, 0.55);
        animation: preBootPulse 2.4s ease-in-out infinite;
      }

      .pre-boot__logo img,
      .pre-boot__logo svg {
        width: 28px;
        height: 28px;
        display: block;
      }

      @keyframes preBootPulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 0 32px -6px rgba(0, 229, 192, 0.55);
        }
        50% {
          transform: scale(1.04);
          box-shadow: 0 0 44px -4px rgba(0, 229, 192, 0.75);
        }
      }

      .pre-boot__title {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0;
      }

      .pre-boot__sub {
        font-size: 0.82rem;
        color: var(--shell-dim-dark);
        margin: 0;
      }

      html:not(.dark) .pre-boot__sub {
        color: var(--shell-dim-light);
      }

      .pre-boot__bar {
        width: 180px;
        height: 3px;
        border-radius: 100px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        position: relative;
      }

      html:not(.dark) .pre-boot__bar {
        background: rgba(15, 18, 35, 0.08);
      }

      .pre-boot__bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 100px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--shell-accent),
          transparent
        );
        animation: preBootSweep 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes preBootSweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }

      /* ── Fatal-error fallback ───────────────────────────────────
         Replaces the splash if the module entry fails to load.
         main.tsx dispatches 'app:fatal' with detail { message, stack }.
         ──────────────────────────────────────────────────────────── */
      .fatal {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .fatal__card {
        max-width: 560px;
        width: 100%;
        background: #0a0c13;
        border: 1px solid rgba(255, 95, 109, 0.35);
        border-radius: 16px;
        padding: 24px;
        font-family:
          'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.78rem;
        color: #e9edf6;
        box-shadow: 0 30px 70px -30px rgba(0, 0, 0, 0.9);
      }

      html:not(.dark) .fatal__card {
        background: #ffffff;
        color: #0b1020;
        border-color: rgba(224, 56, 74, 0.4);
      }

      .fatal__title {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 12px;
        color: #ff5f6d;
      }

      .fatal__msg {
        margin: 0 0 16px;
        padding: 12px;
        border-radius: 10px;
        background: rgba(255, 95, 109, 0.08);
        border: 1px solid rgba(255, 95, 109, 0.2);
        white-space: pre-wrap;
        word-break: break-word;
      }

      .fatal__hint {
        margin: 0;
        color: #8a93a8;
        font-family:
          'Inter',
          system-ui,
          sans-serif;
        font-size: 0.82rem;
        line-height: 1.6;
      }

      html:not(.dark) .fatal__hint {
        color: #5c6478;
      }

      .fatal__hint code {
        padding: 2px 6px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.06);
        font-size: 0.76rem;
      }

      html:not(.dark) .fatal__hint code {
        background: rgba(15, 18, 35, 0.06);
      }

      /* Reduced motion: kill all animation on the shell */
      @media (prefers-reduced-motion: reduce) {
        .pre-boot__logo,
        .pre-boot__bar::after {
          animation: none;
        }
        .pre-boot__bar::after {
          width: 100%;
          opacity: 0.4;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Pre-hydration splash — replaced when React mounts -->
      <div class="pre-boot" aria-busy="true" aria-live="polite">
        <div class="pre-boot__card">
          <span class="pre-boot__logo" aria-hidden="true">
            <img
              src="./public/kkfarm.svg"
              alt=""
              width="28"
              height="28"
              decoding="async"
            />
          </span>
          <div>
            <h1 class="pre-boot__title">Smart Device Cloud</h1>
            <p class="pre-boot__sub">Loading your dashboard…</p>
          </div>
          <span class="pre-boot__bar" aria-hidden="true"></span>
        </div>
      </div>
    </div>

    <noscript>
      <div
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          padding: 2rem;
          font-family:
            system-ui,
            -apple-system,
            'Segoe UI',
            sans-serif;
          color: #e9edf6;
          background: #05060a;
        "
      >
        <div style="max-width: 420px; text-align: center">
          <h1
            style="
              font-size: 1.15rem;
              margin: 0 0 0.5rem;
              letter-spacing: -0.02em;
            "
          >
            JavaScript is required
          </h1>
          <p style="margin: 0; color: #8a93a8; line-height: 1.6">
            Smart Device Cloud relies on JavaScript to render live fleet data,
            stream device sessions, and run the workflow engine. Please enable
            it in your browser settings and reload this page.
          </p>
        </div>
      </div>
    </noscript>

    <!--
      Fatal-error listener. main.tsx and any module-load failure can
      dispatch this to replace the splash with a diagnostic card.
      Also catches unhandled errors before React's error boundary
      has a chance to mount.
    -->
    <script>
      (function () {
        var root = document.getElementById('root');

        function renderFatal(message, stack) {
          if (!root) return;
          var stackBlock = stack
            ? '<div class="fatal__msg">' +
              escapeHtml(stack).slice(0, 1600) +
              '</div>'
            : '';
          root.innerHTML =
            '<div class="fatal" role="alert">' +
            '<div class="fatal__card">' +
            '<h2 class="fatal__title">Dashboard failed to load</h2>' +
            '<div class="fatal__msg">' +
            escapeHtml(message || 'Unknown error') +
            '</div>' +
            stackBlock +
            '<p class="fatal__hint">' +
            'Check the browser console for the full stack. Common causes: ' +
            'a missing <code>QueryClientProvider</code> above the tree, ' +
            'an unresolved import in <code>main.tsx</code>, or the API ' +
            'gateway unreachable at <code>/trpc</code>.' +
            '</p>' +
            '</div>' +
            '</div>';
        }

        function escapeHtml(s) {
          return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        window.addEventListener('app:fatal', function (e) {
          var d = (e && e.detail) || {};
          renderFatal(d.message, d.stack);
        });

        window.addEventListener('error', function (e) {
          // Only intercept module/script load failures before React mounts.
          // Once React is up, its error boundary owns presentation.
          if (document.querySelector('.pre-boot')) {
            renderFatal(e.message, e.error && e.error.stack);
          }
        });

        window.addEventListener('unhandledrejection', function (e) {
          if (document.querySelector('.pre-boot')) {
            var reason = e.reason || {};
            renderFatal(reason.message, reason.stack);
          }
        });
      })();
    </script>

    <!-- Vite entry — must be last so the shell is parsed first -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
