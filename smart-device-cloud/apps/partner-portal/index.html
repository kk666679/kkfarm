<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>KK Farm — Partner Portal</title>

<style>
/* ============================================================
   THEME TOKENS
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root[data-theme="dark"]{
  --bg:#05060a;
  --surface:#0a0c13;
  --surface-2:#10131c;
  --surface-3:#161a25;
  --border:rgba(255,255,255,.07);
  --border-2:rgba(255,255,255,.12);
  --text:#e9edf6;
  --muted:#8a93a8;
  --dim:#5d6579;
  --cyan:#00e5c0;
  --violet:#7c5cff;
  --pink:#ff4d9d;
  --amber:#ffb36b;
  --gold:#f5b942;
  --blue:#5cc8ff;
  --green:#3ddc84;
  --red:#ff5f6d;
  --grid:rgba(255,255,255,.055);
  --axis:#5d6579;
  --shadow:0 20px 50px -20px rgba(0,0,0,.85);
  --glow:0 0 24px -6px rgba(0,229,192,.4);
  --grad:linear-gradient(120deg,#00e5c0 0%,#5cc8ff 45%,#7c5cff 100%);
  --grad-gold:linear-gradient(120deg,#f5b942 0%,#ffd97a 50%,#f5b942 100%);
}
:root[data-theme="light"]{
  --bg:#f4f6fb;
  --surface:#ffffff;
  --surface-2:#f7f9fd;
  --surface-3:#eef1f8;
  --border:rgba(15,18,35,.08);
  --border-2:rgba(15,18,35,.14);
  --text:#0b1020;
  --muted:#5c6478;
  --dim:#8891a8;
  --cyan:#00a889;
  --violet:#6b4dff;
  --pink:#db2f7d;
  --amber:#d9821e;
  --gold:#c8951f;
  --blue:#2b8fe0;
  --green:#1fa95c;
  --red:#e0384a;
  --grid:rgba(15,18,35,.07);
  --axis:#8891a8;
  --shadow:0 18px 40px -22px rgba(15,18,35,.28);
  --glow:0 0 24px -8px rgba(0,168,137,.35);
  --grad:linear-gradient(120deg,#00a889 0%,#2b8fe0 45%,#6b4dff 100%);
  --grad-gold:linear-gradient(120deg,#d99a1a 0%,#e8b84a 50%,#d99a1a 100%);
}

html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background .3s,color .3s;
}
body.no-scroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{display:block}
::selection{background:rgba(0,229,192,.3);color:var(--text)}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--dim);background-clip:content-box;border:3px solid transparent}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{display:flex;min-height:100vh;min-height:100dvh}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;
  width:var(--sb-w,264px);
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  z-index:60;
  transition:width .28s cubic-bezier(.4,0,.2,1),transform .3s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
}
.sidebar.collapsed{--sb-w:76px}

.sb-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:16px 14px;height:64px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.sb-logo{
  display:flex;align-items:center;gap:10px;
  font-family:'Space Grotesk',system-ui,sans-serif;
  font-weight:700;font-size:1rem;letter-spacing:-.03em;
  white-space:nowrap;overflow:hidden;min-width:0;
}
.sb-logo-mark{
  width:32px;height:32px;border-radius:9px;background:var(--grad);
  display:grid;place-items:center;flex-shrink:0;box-shadow:var(--glow);
}
.sb-logo-mark svg{width:16px;height:16px}
.sb-logo-text{opacity:1;transition:opacity .2s,width .28s;overflow:hidden}
.sidebar.collapsed .sb-logo-text{opacity:0;width:0}
.sb-collapse{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;
  display:grid;place-items:center;
  border:1px solid var(--border-2);background:var(--surface-2);
  transition:background .2s,border-color .2s;
}
.sb-collapse:hover{background:var(--surface-3)}
.sb-collapse svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.sidebar.collapsed .sb-collapse svg{transform:rotate(180deg)}

.sb-mobile-close{display:none}

.sb-nav{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:14px 12px 8px;
  display:flex;flex-direction:column;gap:2px;
  scrollbar-width:thin;
}
.sb-section-label{
  font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);font-weight:600;
  padding:14px 12px 6px;
  white-space:nowrap;transition:opacity .2s;
}
.sidebar.collapsed .sb-section-label{opacity:0;height:0;padding:0;overflow:hidden}

.nav-item{
  position:relative;
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:10px;
  color:var(--muted);font-weight:500;font-size:.88rem;
  white-space:nowrap;overflow:hidden;
  transition:background .18s,color .18s;
  min-height:42px;width:100%;text-align:left;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--surface-3);color:var(--text)}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;
  background:var(--grad);border-radius:0 3px 3px 0;
}
.nav-item .ni-icon{width:20px;height:20px;flex-shrink:0;display:grid;place-items:center}
.nav-item .ni-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item .ni-label{flex:1;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
.sidebar.collapsed .ni-label{opacity:0}
.nav-item .ni-badge{
  font-size:.68rem;font-weight:600;padding:2px 7px;border-radius:100px;
  background:rgba(0,229,192,.13);color:var(--cyan);
  flex-shrink:0;transition:opacity .2s;
}
.sidebar.collapsed .ni-badge{opacity:0;width:0;padding:0;overflow:hidden}

/* Portal-based collapsed tooltip (escapes overflow:hidden) */
.sb-tooltip{
  position:fixed;
  z-index:150;
  background:var(--surface-3);
  color:var(--text);
  font-size:.78rem;
  font-weight:500;
  padding:6px 11px;
  border-radius:8px;
  border:1px solid var(--border-2);
  box-shadow:var(--shadow);
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
  transform:translateY(-50%) translateX(-4px) scale(.96);
  transition:opacity .15s,transform .15s;
}
.sb-tooltip.show{
  opacity:1;
  transform:translateY(-50%) translateX(0) scale(1);
}

/* sidebar footer */
.sb-foot{
  border-top:1px solid var(--border);
  padding:10px 12px 14px;
  display:flex;flex-direction:column;gap:2px;
  flex-shrink:0;background:var(--surface);
}

.theme-seg{
  display:flex;align-items:center;gap:3px;
  padding:3px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--border);
  margin-top:6px;overflow:hidden;transition:all .25s;
}
.theme-seg button{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 8px;border-radius:7px;
  color:var(--muted);font-size:.76rem;font-weight:600;
  transition:background .2s,color .2s;
  white-space:nowrap;overflow:hidden;min-width:0;
}
.theme-seg button:hover{color:var(--text)}
.theme-seg button.active{background:var(--surface-3);color:var(--text)}
.theme-seg button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sidebar.collapsed .theme-seg{flex-direction:column;padding:4px}
.sidebar.collapsed .theme-seg button{padding:7px 0;width:100%}
.sidebar.collapsed .ts-label{display:none}

.user-card{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:11px;
  background:var(--surface-2);border:1px solid var(--border);
  margin-top:8px;transition:background .2s,border-color .2s;
  overflow:hidden;min-width:0;text-align:left;width:100%;
}
.user-card:hover{background:var(--surface-3);border-color:var(--border-2)}
.user-avatar{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;
  display:grid;place-items:center;
  font-family:'Space Grotesk',sans-serif;
  font-size:.78rem;font-weight:700;letter-spacing:-.02em;
  color:#04070c;background:var(--grad);
  box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;
  position:relative;
}
.user-avatar.gold{background:var(--grad-gold)}
.user-avatar::after{
  content:'';position:absolute;right:-2px;bottom:-2px;
  width:10px;height:10px;border-radius:50%;
  background:var(--green);border:2px solid var(--surface-2);
}
.user-meta{flex:1;min-width:0;overflow:hidden;transition:opacity .2s}
.user-meta .u-name{font-size:.82rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.user-meta .u-mail{font-size:.7rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.user-card .u-caret{width:14px;height:14px;flex-shrink:0;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round;transition:opacity .2s}
.sidebar.collapsed .user-meta,.sidebar.collapsed .u-caret{opacity:0;width:0}
.sidebar.collapsed .user-card{padding:6px;justify-content:center}
.sidebar.collapsed .user-avatar{width:34px;height:34px}

/* ============================================================
   MAIN
   ============================================================ */
.main{
  flex:1;margin-left:var(--sb-w,264px);min-width:0;
  transition:margin-left .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
.app.sb-collapsed .main{margin-left:76px}

.topbar{
  position:sticky;top:0;z-index:40;
  height:64px;display:flex;align-items:center;gap:14px;
  padding:0 clamp(16px,3vw,28px);
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter:blur(16px) saturate(180%);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.tb-mobile-toggle{
  display:none;width:40px;height:40px;border-radius:10px;
  place-items:center;flex-shrink:0;
  border:1px solid var(--border-2);background:var(--surface);
}
.tb-mobile-toggle svg{width:16px;height:16px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round}

.tb-title-wrap{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.tb-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1.02rem;letter-spacing:-.02em;white-space:nowrap}
.tb-sub{font-size:.76rem;color:var(--dim);white-space:nowrap}

.tb-search{position:relative;width:clamp(160px,26vw,320px);flex-shrink:1}
.tb-search input{
  width:100%;padding:9px 12px 9px 34px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--text);font-size:.84rem;
  transition:border-color .2s,background .2s;min-height:40px;
}
.tb-search input::placeholder{color:var(--dim)}
.tb-search input:focus{outline:none;border-color:var(--border-2);background:var(--surface-3)}
.tb-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}

.tb-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tb-icon{
  width:40px;height:40px;border-radius:10px;
  display:grid;place-items:center;position:relative;
  border:1px solid var(--border);background:var(--surface);
  transition:background .2s,border-color .2s;
}
.tb-icon:hover{background:var(--surface-2);border-color:var(--border-2)}
.tb-icon svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tb-icon .dot{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 2px var(--surface)}

.tier-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:100px;
  background:linear-gradient(120deg,rgba(245,185,66,.16),rgba(245,185,66,.06));
  border:1px solid rgba(245,185,66,.35);
  font-size:.75rem;font-weight:700;letter-spacing:.04em;
  color:var(--gold);white-space:nowrap;
  font-family:'Space Grotesk',sans-serif;
}
.tier-badge svg{width:13px;height:13px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.tb-cta{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 15px;border-radius:10px;
  background:var(--grad);color:#04070c;
  font-weight:600;font-size:.83rem;
  font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em;
  transition:transform .18s,box-shadow .25s;
  min-height:40px;white-space:nowrap;
}
.tb-cta:hover{transform:translateY(-1px);box-shadow:var(--glow)}
.tb-cta svg{width:14px;height:14px;stroke:#04070c;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

.content{
  flex:1;padding:clamp(18px,3vw,28px);
  display:flex;flex-direction:column;gap:clamp(16px,2.5vw,22px);
  max-width:1600px;width:100%;
}

/* ============================================================
   TIER HERO
   ============================================================ */
.tier-hero{
  position:relative;overflow:hidden;
  border-radius:20px;
  padding:clamp(22px,3.2vw,30px);
  background:linear-gradient(120deg,rgba(245,185,66,.14),rgba(124,92,255,.09) 55%,rgba(0,229,192,.06));
  border:1px solid rgba(245,185,66,.24);
  display:grid;
  grid-template-columns:1fr auto;
  gap:clamp(20px,3vw,36px);
  align-items:center;
}
.tier-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 120% at 15% 0%,rgba(245,185,66,.14),transparent 65%);
  pointer-events:none;
}
.tier-hero-left{position:relative;z-index:1;min-width:0}
.tier-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);margin-bottom:10px;
}
.tier-eyebrow svg{width:13px;height:13px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tier-hero h2{
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(1.4rem,3.6vw,2rem);
  font-weight:700;letter-spacing:-.03em;line-height:1.1;
  margin-bottom:10px;
}
.tier-hero h2 .grad{
  background:var(--grad-gold);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.tier-hero p{font-size:clamp(.85rem,2vw,.92rem);color:var(--muted);max-width:58ch;line-height:1.6}

.tier-progress{margin-top:18px;max-width:560px}
.tier-progress-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  font-size:.78rem;margin-bottom:8px;
}
.tier-progress-head .tp-current{color:var(--muted)}
.tier-progress-head .tp-target{color:var(--gold);font-weight:600;font-family:'Space Grotesk',sans-serif}
.tier-bar{
  height:9px;border-radius:100px;
  background:rgba(255,255,255,.08);
  overflow:hidden;position:relative;
  border:1px solid rgba(255,255,255,.05);
}
.tier-bar-fill{
  height:100%;border-radius:100px;
  background:var(--grad-gold);
  box-shadow:0 0 18px -3px rgba(245,185,66,.7);
  position:relative;overflow:hidden;
}
.tier-bar-fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  transform:translateX(-100%);
  animation:shimmer 2.6s ease-in-out infinite;
}
@keyframes shimmer{0%{transform:translateX(-100%)}60%,100%{transform:translateX(200%)}}

.tier-steps{
  display:flex;justify-content:space-between;gap:8px;
  margin-top:12px;font-size:.7rem;color:var(--dim);
}
.tier-steps .step.done{color:var(--gold);font-weight:600}
.tier-steps .step.current{color:var(--text);font-weight:600}

.tier-hero-right{
  position:relative;z-index:1;
  display:flex;flex-direction:column;gap:12px;
  min-width:200px;
}
.tier-stat{
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;padding:12px 14px;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.tier-stat .ts-label{
  font-size:.66rem;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim);margin-bottom:5px;
}
.tier-stat .ts-value{
  font-family:'Space Grotesk',sans-serif;
  font-size:1.35rem;font-weight:700;letter-spacing:-.03em;line-height:1;
}
.tier-stat .ts-value small{font-size:.72rem;font-weight:500;color:var(--dim);letter-spacing:0;margin-left:3px}
.tier-stat .ts-rate{color:var(--gold)}

/* ============================================================
   KPI CARDS
   ============================================================ */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:clamp(12px,2vw,16px)}
.kpi{
  position:relative;overflow:hidden;
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:18px;
  display:flex;flex-direction:column;gap:12px;
  transition:border-color .25s,transform .3s;
}
.kpi:hover{border-color:var(--border-2);transform:translateY(-2px)}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.kpi-label{font-size:.74rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.kpi-icon{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  display:grid;place-items:center;
  background:rgba(0,229,192,.1);border:1px solid rgba(0,229,192,.18);
}
.kpi-icon svg{width:15px;height:15px;stroke:var(--cyan);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kpi-icon.v{background:rgba(124,92,255,.11);border-color:rgba(124,92,255,.22)}
.kpi-icon.v svg{stroke:var(--violet)}
.kpi-icon.p{background:rgba(255,77,157,.1);border-color:rgba(255,77,157,.2)}
.kpi-icon.p svg{stroke:var(--pink)}
.kpi-icon.a{background:rgba(255,179,107,.1);border-color:rgba(255,179,107,.2)}
.kpi-icon.a svg{stroke:var(--amber)}
.kpi-icon.g{background:rgba(245,185,66,.11);border-color:rgba(245,185,66,.24)}
.kpi-icon.g svg{stroke:var(--gold)}

.kpi-value{
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(1.55rem,3.4vw,1.9rem);
  font-weight:700;letter-spacing:-.035em;line-height:1;
  display:flex;align-items:baseline;gap:6px;
}
.kpi-value .unit{font-size:.85rem;font-weight:500;color:var(--dim);letter-spacing:0}
.kpi-delta{
  display:inline-flex;align-items:center;gap:4px;
  font-size:.76rem;font-weight:600;
  padding:3px 8px;border-radius:100px;
  background:rgba(61,220,132,.12);color:var(--green);
  width:fit-content;
}
.kpi-delta.down{background:rgba(255,95,109,.12);color:var(--red)}
.kpi-delta.neutral{background:var(--surface-2);color:var(--dim)}
.kpi-delta svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.kpi-spark{height:36px;margin:0 -4px -4px}

/* ============================================================
   CARDS / GRID
   ============================================================ */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(12px,2vw,16px)}
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:clamp(16px,2.4vw,20px);
  display:flex;flex-direction:column;min-width:0;
  transition:border-color .25s;
}
.card:hover{border-color:var(--border-2)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
.card-title{
  font-family:'Space Grotesk',sans-serif;
  font-size:.98rem;font-weight:600;letter-spacing:-.02em;
  display:flex;align-items:center;gap:8px;
}
.card-sub{font-size:.76rem;color:var(--dim);margin-top:3px}
.card-metric{font-family:'Space Grotesk',sans-serif;font-size:1.28rem;font-weight:700;letter-spacing:-.03em;line-height:1;text-align:right}
.card-metric small{font-size:.72rem;font-weight:500;color:var(--dim);letter-spacing:0;display:block;margin-top:3px}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 9px;border-radius:100px;
  font-size:.7rem;font-weight:600;
  background:var(--surface-2);color:var(--muted);
  border:1px solid var(--border);white-space:nowrap;
}
.chip.live{background:rgba(0,229,192,.1);color:var(--cyan);border-color:rgba(0,229,192,.2)}
.chip.gold{background:rgba(245,185,66,.12);color:var(--gold);border-color:rgba(245,185,66,.28)}
.chip .pulse{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:pulse 2s infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(0,229,192,.6)}
  70%{box-shadow:0 0 0 7px rgba(0,229,192,0)}
  100%{box-shadow:0 0 0 0 rgba(0,229,192,0)}
}
.chart-body{flex:1;min-height:0;margin:0 -6px -4px}

.c-12{grid-column:span 12}
.c-8{grid-column:span 8}
.c-7{grid-column:span 7}
.c-6{grid-column:span 6}
.c-5{grid-column:span 5}
.c-4{grid-column:span 4}
.c-3{grid-column:span 3}

@media (max-width:1200px){
  .c-8,.c-4,.c-5,.c-7{grid-column:span 12}
  .c-6,.c-3{grid-column:span 6}
}
@media (max-width:820px){
  .c-6,.c-3{grid-column:span 12}
}

/* ============================================================
   RECHARTS
   ============================================================ */
.recharts-wrapper{font-size:11px}
.recharts-cartesian-axis-tick text{fill:var(--axis);font-size:11px}
.recharts-cartesian-grid line{stroke:var(--grid)}
.recharts-polar-grid-angle line,.recharts-polar-grid-concentric path{stroke:var(--grid)}
.recharts-polar-angle-axis-tick text{fill:var(--axis);font-size:10.5px}
.recharts-polar-radius-axis-tick text{fill:var(--dim);font-size:10px}
.recharts-legend-item-text{color:var(--muted)!important;font-size:11.5px}
.recharts-tooltip-cursor{fill:var(--grid)}

.chart-tooltip{
  background:var(--surface-3);border:1px solid var(--border-2);
  border-radius:11px;padding:10px 12px;
  box-shadow:var(--shadow);font-size:.78rem;min-width:140px;
}
.chart-tooltip-label{
  font-weight:600;color:var(--text);font-size:.76rem;letter-spacing:.02em;
  margin-bottom:7px;padding-bottom:7px;border-bottom:1px solid var(--border);
}
.chart-tooltip-row{display:flex;align-items:center;gap:8px;padding:2px 0}
.chart-tooltip-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0}
.chart-tooltip-name{color:var(--muted);flex:1;white-space:nowrap}
.chart-tooltip-value{font-weight:600;color:var(--text);font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums}

/* ============================================================
   REFERRAL LINK
   ============================================================ */
.ref-box{
  display:flex;flex-direction:column;gap:14px;
  height:100%;
}
.ref-input-wrap{
  display:flex;align-items:center;gap:0;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:10px;overflow:hidden;
  transition:border-color .2s,box-shadow .2s;
  min-height:46px;
}
.ref-input-wrap:focus-within{border-color:rgba(0,229,192,.5);box-shadow:0 0 0 3px rgba(0,229,192,.1)}
.ref-prefix{
  padding:0 10px;font-size:.78rem;color:var(--dim);
  font-family:ui-monospace,monospace;white-space:nowrap;
  border-right:1px solid var(--border);
  align-self:stretch;display:flex;align-items:center;
  background:var(--surface-3);
}
.ref-input{
  flex:1;min-width:0;
  padding:11px 12px;background:transparent;border:none;
  color:var(--text);font-size:.82rem;
  font-family:ui-monospace,monospace;
}
.ref-input:focus{outline:none}
.ref-copy{
  padding:0 14px;align-self:stretch;
  display:flex;align-items:center;gap:6px;
  background:var(--surface-3);border-left:1px solid var(--border);
  font-size:.78rem;font-weight:600;color:var(--muted);
  transition:background .2s,color .2s;white-space:nowrap;
}
.ref-copy:hover{background:var(--surface-2);color:var(--text)}
.ref-copy.copied{color:var(--green)}
.ref-copy svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.ref-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ref-stat{
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:11px;padding:12px;
}
.ref-stat .rs-val{
  font-family:'Space Grotesk',sans-serif;
  font-size:1.15rem;font-weight:700;letter-spacing:-.03em;line-height:1;
}
.ref-stat .rs-lbl{
  font-size:.68rem;color:var(--dim);letter-spacing:.06em;
  text-transform:uppercase;margin-top:5px;font-weight:600;
}

/* ============================================================
   TABLE
   ============================================================ */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -6px}
table{width:100%;border-collapse:collapse;min-width:640px}
th{
  text-align:left;font-size:.7rem;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);
  padding:0 12px 11px;border-bottom:1px solid var(--border);white-space:nowrap;
}
td{
  padding:13px 12px;border-bottom:1px solid var(--border);
  font-size:.85rem;color:var(--muted);white-space:nowrap;
}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
td.strong{color:var(--text);font-weight:500}
.deal-cell{display:flex;align-items:center;gap:10px}
.deal-avatar{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  display:grid;place-items:center;
  font-family:'Space Grotesk',sans-serif;
  font-size:.72rem;font-weight:700;letter-spacing:-.02em;
  color:#04070c;
}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.78rem;font-variant-numeric:tabular-nums}

.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:100px;
  font-size:.72rem;font-weight:600;
}
.pill.green{background:rgba(61,220,132,.12);color:var(--green)}
.pill.amber{background:rgba(255,179,107,.12);color:var(--amber)}
.pill.violet{background:rgba(124,92,255,.13);color:var(--violet)}
.pill.cyan{background:rgba(0,229,192,.1);color:var(--cyan)}
.pill.pink{background:rgba(255,77,157,.12);color:var(--pink)}
.pill.gold{background:rgba(245,185,66,.13);color:var(--gold)}
.pill.gray{background:var(--surface-2);color:var(--dim)}

/* ============================================================
   LEADERBOARD
   ============================================================ */
.lb{display:flex;flex-direction:column;gap:10px}
.lb-row{
  display:flex;align-items:center;gap:12px;
  padding:11px 12px;border-radius:11px;
  background:var(--surface-2);border:1px solid transparent;
  transition:background .2s,border-color .2s;
}
.lb-row:hover{background:var(--surface-3)}
.lb-row.me{
  border-color:rgba(0,229,192,.35);
  background:linear-gradient(120deg,rgba(0,229,192,.08),rgba(124,92,255,.04));
}
.lb-rank{
  width:26px;height:26px;border-radius:8px;flex-shrink:0;
  display:grid;place-items:center;
  font-family:'Space Grotesk',sans-serif;
  font-size:.76rem;font-weight:700;
  background:var(--surface-3);color:var(--muted);
}
.lb-rank.gold{background:var(--grad-gold);color:#04070c}
.lb-rank.silver{background:linear-gradient(120deg,#c9d3e0,#eef2f8);color:#04070c}
.lb-rank.bronze{background:linear-gradient(120deg,#c98a5a,#e8b287);color:#04070c}
.lb-name{flex:1;min-width:0;font-size:.86rem;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis}
.lb-name small{display:block;font-size:.72rem;color:var(--dim);font-weight:400}
.lb-amount{
  font-family:'Space Grotesk',sans-serif;
  font-size:.88rem;font-weight:700;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.lb-you{
  font-size:.62rem;font-weight:700;letter-spacing:.08em;
  padding:2px 6px;border-radius:100px;
  background:rgba(0,229,192,.14);color:var(--cyan);
  flex-shrink:0;
}

/* ============================================================
   RESOURCES
   ============================================================ */
.res-grid{display:grid;grid-template-columns:1fr;gap:10px}
.res-item{
  display:flex;align-items:center;gap:13px;
  padding:13px 14px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--border);
  transition:background .2s,border-color .2s,transform .2s;
  text-align:left;width:100%;
}
.res-item:hover{background:var(--surface-3);border-color:var(--border-2);transform:translateX(2px)}
.res-ico{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  display:grid;place-items:center;
  background:linear-gradient(140deg,rgba(0,229,192,.14),rgba(124,92,255,.12));
  border:1px solid rgba(255,255,255,.07);
}
.res-ico svg{width:16px;height:16px;stroke:var(--cyan);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.res-body{flex:1;min-width:0}
.res-body .r-title{font-size:.86rem;font-weight:600;color:var(--text);line-height:1.3}
.res-body .r-desc{font-size:.74rem;color:var(--dim);margin-top:2px;line-height:1.4}
.res-arrow{width:14px;height:14px;flex-shrink:0;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
   MODAL / OVERLAY
   ============================================================ */
.overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(2,4,8,.72);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:grid;place-items:center;padding:20px;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--border-2);
  border-radius:18px;box-shadow:var(--shadow);
  animation:slideUp .28s cubic-bezier(.2,.9,.3,1);
}
@keyframes slideUp{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:22px 22px 18px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--surface);z-index:2;
  border-radius:18px 18px 0 0;
}
.modal-head h3{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:600;letter-spacing:-.025em}
.modal-head p{font-size:.82rem;color:var(--dim);margin-top:4px;line-height:1.5}
.modal-close{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  display:grid;place-items:center;
  border:1px solid var(--border);background:var(--surface-2);
  transition:background .2s;
}
.modal-close:hover{background:var(--surface-3)}
.modal-close svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round}
.modal-body{padding:22px;display:flex;flex-direction:column;gap:18px}
.modal-foot{
  display:flex;gap:10px;justify-content:flex-end;
  padding:16px 22px 20px;border-top:1px solid var(--border);
  position:sticky;bottom:0;background:var(--surface);
  border-radius:0 0 18px 18px;
}

.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:.76rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--text);font-size:.88rem;
  transition:border-color .2s,background .2s;min-height:44px;
  font-family:inherit;
}
.field textarea{min-height:88px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:rgba(0,229,192,.5);
  background:var(--surface-3);box-shadow:0 0 0 3px rgba(0,229,192,.1);
}
.field select{cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235d6579' stroke-width='2' stroke-linecap='round'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
  background-repeat:no-repeat;background-position:right 12px center;background-size:14px;
  padding-right:36px;
}
.field .hint{font-size:.74rem;color:var(--dim);line-height:1.5}

.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.field-row{grid-template-columns:1fr}}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:10px;
  font-size:.86rem;font-weight:600;
  font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em;
  transition:transform .18s,box-shadow .25s,background .25s,border-color .25s;
  white-space:nowrap;min-height:42px;
}
.btn-primary{background:var(--grad);color:#04070c;box-shadow:0 6px 22px -8px rgba(0,229,192,.5)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 32px -10px rgba(0,229,192,.65)}
.btn-gold{background:var(--grad-gold);color:#04070c;box-shadow:0 6px 22px -8px rgba(245,185,66,.5)}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 12px 32px -10px rgba(245,185,66,.6)}
.btn-ghost{background:var(--surface-2);border:1px solid var(--border-2);color:var(--text)}
.btn-ghost:hover{background:var(--surface-3)}
.btn-sm{padding:8px 14px;font-size:.82rem;min-height:36px}

/* ============================================================
   POPOVER
   ============================================================ */
.popover{
  position:fixed;z-index:150;
  background:var(--surface);border:1px solid var(--border-2);
  border-radius:14px;box-shadow:var(--shadow);
  padding:8px;min-width:240px;
  animation:slideUp .18s cubic-bezier(.2,.9,.3,1);
}
.pop-head{
  display:flex;align-items:center;gap:11px;
  padding:10px 10px 12px;border-bottom:1px solid var(--border);
  margin-bottom:6px;
}
.pop-head .user-avatar{width:38px;height:38px;font-size:.88rem}
.pop-head .u-name{font-size:.88rem;font-weight:600;line-height:1.25}
.pop-head .u-mail{font-size:.74rem;color:var(--dim);line-height:1.3}
.pop-item{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:9px 10px;border-radius:9px;
  font-size:.85rem;color:var(--muted);font-weight:500;
  transition:background .15s,color .15s;text-align:left;
}
.pop-item:hover{background:var(--surface-2);color:var(--text)}
.pop-item svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.pop-item.danger{color:var(--red)}
.pop-item.danger:hover{background:rgba(255,95,109,.08)}
.pop-sep{height:1px;background:var(--border);margin:6px 4px}

/* ============================================================
   MOBILE
   ============================================================ */
.sb-backdrop{
  display:none;position:fixed;inset:0;z-index:55;
  background:rgba(2,4,8,.6);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  animation:fadeIn .2s;
}

@media (max-width:1024px){
  .sidebar{width:280px !important;transform:translateX(-100%);box-shadow:var(--shadow)}
  .sidebar.mobile-open{transform:translateX(0)}
  .main{margin-left:0 !important}
  .sb-collapse{display:none}
  .sb-mobile-close{
    display:grid;width:34px;height:34px;border-radius:9px;
    place-items:center;flex-shrink:0;
    border:1px solid var(--border-2);background:var(--surface-2);
  }
  .sb-mobile-close svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round}
  .sb-backdrop.show{display:block}
  .tb-mobile-toggle{display:grid}
  .sidebar .sb-logo-text{opacity:1!important;width:auto!important}
  .sidebar .ni-label{opacity:1!important}
  .sidebar .ni-badge{opacity:1!important;width:auto!important;padding:2px 7px!important}
  .sidebar .sb-section-label{opacity:1!important;height:auto!important;padding:14px 12px 6px!important}
  .sidebar .user-meta,.sidebar .u-caret{opacity:1!important;width:auto!important}
  .sidebar .user-card{padding:9px 10px!important;justify-content:flex-start!important}
  .sidebar .theme-seg{flex-direction:row!important;padding:3px!important}
  .sidebar .theme-seg button{padding:7px 8px!important;width:auto!important;flex:1!important}
  .sidebar .ts-label{display:inline!important}
  .tier-hero{grid-template-columns:1fr}
  .tier-hero-right{flex-direction:row;flex-wrap:wrap}
  .tier-stat{flex:1 1 140px}
}

@media (max-width:720px){
  .topbar{height:58px;gap:10px;padding:0 14px}
  .tb-search{display:none}
  .tb-title{font-size:.94rem}
  .tb-sub{font-size:.7rem}
  .tb-cta span{display:none}
  .tb-cta{padding:0;width:40px;justify-content:center}
  .content{padding:14px;gap:14px}
  .kpi{padding:15px}
  .card{padding:15px;border-radius:14px}
  .modal{max-width:100%;border-radius:16px}
  .tier-steps{font-size:.66rem}
  .tier-badge{display:none}
}

@media (max-width:420px){
  .tb-title-wrap .tb-sub{display:none}
  .kpi-row{grid-template-columns:1fr 1fr;gap:10px}
  .kpi-value{font-size:1.35rem}
  .kpi-icon{width:30px;height:30px}
  .ref-stats{grid-template-columns:1fr}
  .tier-hero-right{flex-direction:column}
  .tier-stat{flex:1 1 auto}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .sb-tooltip{transition:none}
}

/* ============================================================
   THEME HOOK
   ============================================================ */
function useTheme(){
  const [mode, setMode] = useState(()=>{
    try { return localStorage.getItem('nf-theme') || 'dark'; }
    catch(e){ return 'dark'; }
  });
  const [resolved, setResolved] = useState('dark');

  useEffect(()=>{
    const root = document.documentElement;
    const apply = (m)=>{
      let r;
      if(m === 'system'){
        r = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } else r = m;
      root.setAttribute('data-theme', r);
      setResolved(r);
    };
    apply(mode);
    try { localStorage.setItem('nf-theme', mode); } catch(e){}

    if(mode === 'system'){
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      const handler = ()=> apply('system');
      if(mq.addEventListener) mq.addEventListener('change', handler);
      else mq.addListener(handler);
      return ()=>{
        if(mq.removeEventListener) mq.removeEventListener('change', handler);
        else mq.removeListener(handler);
      };
    }
  },[mode]);

  return { mode, setMode, resolved };
}

        grid:'rgba(15,18,35,.07)', axis:'#8891a8',

      {payload.map((p,i)=>(

        </div>
      ))}

  );
}

   ============================================================ */
function ProfilePopover({ anchor, onClose }){
  const ref = useRef(null);
  const [pos, setPos] = useState({bottom:0,left:0});

  useEffect(()=>{
    if(anchor){
      const r = anchor.getBoundingClientRect();
      const W = 240;
      let left = r.left;
      if(left + W > window.innerWidth - 12) left = window.innerWidth - W - 12;
      if(left < 12) left = 12;
      setPos({ bottom: window.innerHeight - r.top + 10, left });
    }
  },[anchor]);

  useEffect(()=>{
    if(!anchor) return;
    const onDoc = (e)=>{
      if(ref.current && !ref.current.contains(e.target) && !anchor.contains(e.target)) onClose();
    };
    const onEsc = (e)=>{ if(e.key === 'Escape') onClose(); };
    document.addEventListener('mousedown', onDoc);
    document.addEventListener('keydown', onEsc);
    return ()=>{
      document.removeEventListener('mousedown', onDoc);
      document.removeEventListener('keydown', onEsc);
    };
  },[anchor,onClose]);

  if(!anchor) return null;

  return (
    <div className="popover" ref={ref} style={{bottom: pos.bottom, left: pos.left, position:'fixed'}}>
      <div className="pop-head">
        <span className="user-avatar gold">AR</span>
        <span style={{minWidth:0}}>
          <div className="u-name">Alex Rivera</div>
          <div className="u-mail">alex@kkfarm.io</div>
        </span>
      </div>
      <button type="button" className="pop-item" onClick={onClose}>{I.user}<span>Partner profile</span></button>
      <button type="button" className="pop-item" onClick={onClose}>{I.briefcase}<span>Company details</span></button>
      <button type="button" className="pop-item" onClick={onClose}>{I.shield}<span>Certifications</span></button>
      <button type="button" className="pop-item" onClick={onClose}>{I.wallet}<span>Payout settings</span></button>
      <div className="pop-sep" />
      <button type="button" className="pop-item" onClick={onClose}>{I.book}<span>Partner handbook</span></button>
      <button type="button" className="pop-item danger" onClick={onClose}>{I.logout}<span>Sign out</span></button>
    </div>
  );
}

/* ============================================================
   KPI CARD
   ============================================================ */
function KPI({ label, value, unit, delta, deltaDir='up', icon, iconClass='', spark, sparkColor, prefix }){
  const data = spark.map(v=>({v}));
  const gradId = `kg-${label.replace(/\s+/g,'-').toLowerCase()}`;
  return (
    <div className="kpi">
      <div className="kpi-top">
        <div>
          <div className="kpi-label">{label}</div>
          <div className="kpi-value" style={{marginTop:8}}>
            {prefix}{value}{unit && <span className="unit">{unit}</span>}
          </div>
        </div>
        <div className={`kpi-icon ${iconClass}`}>{icon}</div>
      </div>
      <div className={`kpi-delta ${deltaDir==='down'?'down':''} ${deltaDir==='neutral'?'neutral':''}`}>
        {deltaDir==='up' && I.arrowUp}
        {deltaDir==='down' && I.arrowDown}
        <span>{delta}</span>
      </div>
      <div className="kpi-spark">
        <ResponsiveContainer width="100%" height="100%">
          <AreaChart data={data} margin={{top:2,right:0,left:0,bottom:0}}>
            <defs>
              <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor={sparkColor} stopOpacity={0.32} />
                <stop offset="100%" stopColor={sparkColor} stopOpacity={0} />
              </linearGradient>
            </defs>
            <Area type="monotone" dataKey="v" stroke={sparkColor} strokeWidth={1.8} fill={`url(#${gradId})`} animationDuration={900} />
          </AreaChart>
        </ResponsiveContainer>
      </div>
    </div>
  );
}

function TreemapCell(props){
  const { x, y, width, height, name, size, fill } = props;
  if(width < 4 || height < 4) return null;
  const showLabel = width > 54 && height > 28;
  return (
    <g>
      <rect x={x} y={y} width={width} height={height} rx={5}
        style={{fill, stroke:'var(--surface)', strokeWidth:2, fillOpacity:.85}} />
      {showLabel && (
        <>
          <text x={x+8} y={y+17} fill="#04070c" fontSize="11" fontWeight="700"
            fontFamily="Space Grotesk, sans-serif">{name}</text>
          <text x={x+8} y={y+31} fill="rgba(4,7,12,.7)" fontSize="10"
            fontFamily="Inter, sans-serif">{size} customers</text>
        </>
      )}
    </g>
  );
}

              <span className="res-body">
                <span className="r-title">Certification program</span>
                <span className="r-desc">Get certified and unlock higher commission tiers</span>
              </span>
              <svg className="res-arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
      </div>
    </>
  );
}

/* ============================================================
   PLACEHOLDER
   ============================================================ */
function PlaceholderView({ label }){
  return (
    <div className="card c-12" style={{minHeight:'60vh', display:'grid', placeItems:'center', textAlign:'center'}}>
      <div>
        <div style={{
          width:64, height:64, borderRadius:18, margin:'0 auto 20px',
          background:'var(--surface-2)', border:'1px solid var(--border)',
          display:'grid', placeItems:'center'
        }}>
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/>
          </svg>
        </div>
        <div style={{fontFamily:'Space Grotesk, sans-serif', fontSize:'1.1rem', fontWeight:600, letterSpacing:'-.02em'}}>
          {label}
        </div>
        <div style={{color:'var(--dim)', fontSize:'.85rem', marginTop:6, maxWidth:'36ch'}}>
          This section is part of the demo. Switch back to <strong style={{color:'var(--muted)'}}>Overview</strong> to explore the charts.
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App(){
  const { mode, setMode, resolved } = useTheme();
  const palette = usePalette(resolved);

  const [collapsed, setCollapsed] = useState(()=>{
    try { return localStorage.getItem('nf-sb') === '1'; }
    catch(e){ return false; }
  });
  const [mobileOpen, setMobileOpen] = useState(false);
  const [active, setActive] = useState('overview');
  const [dealOpen, setDealOpen] = useState(false);
  const [profileAnchor, setProfileAnchor] = useState(null);
  const profileRef = useRef(null);

  useEffect(()=>{
    try { localStorage.setItem('nf-sb', collapsed ? '1' : '0'); } catch(e){}
  },[collapsed]);

  useEffect(()=>{
    const onResize = ()=>{ if(window.innerWidth > 1024) setMobileOpen(false); };
    window.addEventListener('resize', onResize);
    return ()=> window.removeEventListener('resize', onResize);
  },[]);

  useEffect(()=>{
    if(!profileAnchor) return;
    const close = ()=> setProfileAnchor(null);
    window.addEventListener('resize', close);
    window.addEventListener('scroll', close, true);
    return ()=>{
      window.removeEventListener('resize', close);
      window.removeEventListener('scroll', close, true);
    };
  },[profileAnchor]);

  const titles = {
    overview:    { t:'Partner overview', s:'Q3 2026 · Gold tier' },
    deals:       { t:'Deals',            s:'14 active opportunities' },
    commissions: { t:'Commissions',      s:'25% recurring rate' },
    customers:   { t:'Customers',        s:'128 referred accounts' },
    referrals:   { t:'Referrals',        s:'Track clicks and signups' },
    marketing:   { t:'Marketing',        s:'Assets and campaigns' },
    leaderboard: { t:'Leaderboard',      s:'Rank #4 of 128 partners' },
    payouts:     { t:'Payouts',          s:'Next payout Sep 03' },
    settings:    { t:'Settings',         s:'Account preferences' },
  };
  const meta = titles[active] || { t:'Partner overview', s:'' };

  const navLabel = useMemo(()=>{
    for(const g of NAV) for(const it of g.items) if(it.id === active) return it.label;
    return 'Overview';
  },[active]);

  return (
    <div className={`app ${collapsed?'sb-collapsed':''}`}>
      <Sidebar
        collapsed={collapsed} setCollapsed={setCollapsed}
        mobileOpen={mobileOpen} setMobileOpen={setMobileOpen}
        active={active} setActive={setActive}
        theme={mode} setTheme={setMode}
        onProfileClick={()=> setProfileAnchor(a => a ? null : profileRef.current)}
        profileRef={profileRef}
      />

      <div className="main">
        <Topbar
          onMobileMenu={()=>setMobileOpen(true)}
          title={meta.t}
          subtitle={meta.s}
        />

        <div className="content">
          {active === 'overview'
            ? <Overview palette={palette} />
            : <div className="grid"><PlaceholderView label={navLabel} /></div>
          }
        </div>
      </div>

      {/* Floating action button for new deal */}
      <button
        type="button"
        className="tb-cta"
        onClick={()=>setDealOpen(true)}
        style={{
          position:'fixed', bottom:'clamp(16px,3vw,28px)', right:'clamp(16px,3vw,28px)',
          zIndex:90, boxShadow:'0 12px 32px -8px rgba(0,229,192,.55)',
          padding:'13px 20px', minHeight:48
        }}
        aria-label="Register new deal"
      >
        {I.plus}<span>Register deal</span>
      </button>

      <ProfilePopover anchor={profileAnchor} onClose={()=>setProfileAnchor(null)} />
      <NewDealModal open={dealOpen} onClose={()=>setDealOpen(false)} />
    </div>
  );
}

createRoot(document.getElementById('root')).render(<App />);
</script>

<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
</body>
</html>
