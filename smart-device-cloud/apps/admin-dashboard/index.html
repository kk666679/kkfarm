<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>KK Farm — Dashboard</title>

<style>
/* ============================================================
   TOKENS / THEME
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root[data-theme="dark"]{
  --bg:#05060a;
  --surface:#0a0c13;
  --surface-2:#10131c;
  --surface-3:#161a25;
  --border:rgba(255,255,255,.07);
  --border-2:rgba(255,255,255,.12);
  --text:#e9edf6;
  --muted:#8a93a8;
  --dim:#5d6579;
  --cyan:#00e5c0;
  --violet:#7c5cff;
  --pink:#ff4d9d;
  --amber:#ffb36b;
  --blue:#5cc8ff;
  --green:#3ddc84;
  --red:#ff5f6d;
  --grid:rgba(255,255,255,.055);
  --axis:#5d6579;
  --shadow:0 20px 50px -20px rgba(0,0,0,.85);
  --glow:0 0 24px -6px rgba(0,229,192,.4);
  --grad:linear-gradient(120deg,#00e5c0 0%,#5cc8ff 45%,#7c5cff 100%);
}
:root[data-theme="light"]{
  --bg:#f4f6fb;
  --surface:#ffffff;
  --surface-2:#f7f9fd;
  --surface-3:#eef1f8;
  --border:rgba(15,18,35,.08);
  --border-2:rgba(15,18,35,.14);
  --text:#0b1020;
  --muted:#5c6478;
  --dim:#8891a8;
  --cyan:#00a889;
  --violet:#6b4dff;
  --pink:#db2f7d;
  --amber:#d9821e;
  --blue:#2b8fe0;
  --green:#1fa95c;
  --red:#e0384a;
  --grid:rgba(15,18,35,.07);
  --axis:#8891a8;
  --shadow:0 18px 40px -22px rgba(15,18,35,.28);
  --glow:0 0 24px -8px rgba(0,168,137,.35);
  --grad:linear-gradient(120deg,#00a889 0%,#2b8fe0 45%,#6b4dff 100%);
}

html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background .3s,color .3s;
}
body.no-scroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{display:block}
::selection{background:rgba(0,229,192,.3);color:var(--text)}

/* scrollbar */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--dim);background-clip:content-box;border:3px solid transparent}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{
  display:flex;
  min-height:100vh;
  min-height:100dvh;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar{
  position:fixed;
  top:0;left:0;bottom:0;
  width:var(--sb-w,260px);
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  z-index:60;
  transition:width .28s cubic-bezier(.4,0,.2,1),transform .3s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
}
.sidebar.collapsed{--sb-w:74px}

/* sidebar head */
.sb-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;
  padding:16px 14px;
  height:64px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.sb-logo{
  display:flex;align-items:center;gap:10px;
  font-family:'Space Grotesk',system-ui,sans-serif;
  font-weight:700;font-size:1rem;letter-spacing:-.03em;
  white-space:nowrap;overflow:hidden;
  min-width:0;
}
.sb-logo-mark{
  width:32px;height:32px;border-radius:9px;background:var(--grad);
  display:grid;place-items:center;flex-shrink:0;
  box-shadow:var(--glow);
}
.sb-logo-mark svg{width:16px;height:16px}
.sb-logo-text{
  opacity:1;transition:opacity .2s,width .28s;
  overflow:hidden;
}
.sidebar.collapsed .sb-logo-text{opacity:0;width:0}
.sb-collapse{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;
  display:grid;place-items:center;
  border:1px solid var(--border-2);
  background:var(--surface-2);
  transition:background .2s,border-color .2s,transform .3s;
}
.sb-collapse:hover{background:var(--surface-3);border-color:var(--border-2)}
.sb-collapse svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.sidebar.collapsed .sb-collapse svg{transform:rotate(180deg)}

/* mobile close */
.sb-mobile-close{display:none}

/* nav */
.sb-nav{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:14px 12px 8px;
  display:flex;flex-direction:column;gap:2px;
  scrollbar-width:thin;
}
.sb-section-label{
  font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);font-weight:600;
  padding:14px 12px 6px;
  white-space:nowrap;
  transition:opacity .2s;
}
.sidebar.collapsed .sb-section-label{opacity:0;height:0;padding:0;overflow:hidden}

.nav-item{
  position:relative;
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:10px;
  color:var(--muted);font-weight:500;font-size:.88rem;
  white-space:nowrap;overflow:hidden;
  transition:background .18s,color .18s;
  min-height:42px;
  width:100%;
  text-align:left;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--surface-3);color:var(--text)}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;
  background:var(--grad);border-radius:0 3px 3px 0;
}
.nav-item .ni-icon{
  width:20px;height:20px;flex-shrink:0;display:grid;place-items:center;
}
.nav-item .ni-icon svg{
  width:18px;height:18px;stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}
.nav-item .ni-label{
  flex:1;overflow:hidden;text-overflow:ellipsis;
  transition:opacity .2s;
}
.sidebar.collapsed .ni-label{opacity:0}
.nav-item .ni-badge{
  font-size:.68rem;font-weight:600;
  padding:2px 7px;border-radius:100px;
  background:rgba(0,229,192,.13);color:var(--cyan);
  flex-shrink:0;
  transition:opacity .2s;
}
.sidebar.collapsed .ni-badge{opacity:0;width:0;padding:0;overflow:hidden}

/* Portal-based collapsed tooltip (escapes overflow:hidden) */
.sb-tooltip{
  position:fixed;
  z-index:150;
  background:var(--surface-3);
  color:var(--text);
  font-size:.78rem;
  font-weight:500;
  padding:6px 11px;
  border-radius:8px;
  border:1px solid var(--border-2);
  box-shadow:var(--shadow);
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
  transform:translateY(-50%) translateX(-4px) scale(.96);
  transition:opacity .15s,transform .15s;
}
.sb-tooltip.show{
  opacity:1;
  transform:translateY(-50%) translateX(0) scale(1);
}

/* sidebar footer */
.sb-foot{
  border-top:1px solid var(--border);
  padding:10px 12px 14px;
  display:flex;flex-direction:column;gap:2px;
  flex-shrink:0;
  background:var(--surface);
}

/* theme segmented control */
.theme-seg{
  display:flex;align-items:center;gap:3px;
  padding:3px;border-radius:10px;
  background:var(--surface-2);
  border:1px solid var(--border);
  margin-top:6px;
  overflow:hidden;
  transition:all .25s;
}
.theme-seg button{
  flex:1;
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 8px;border-radius:7px;
  color:var(--muted);font-size:.76rem;font-weight:600;
  transition:background .2s,color .2s;
  white-space:nowrap;overflow:hidden;
  min-width:0;
}
.theme-seg button:hover{color:var(--text)}
.theme-seg button.active{background:var(--surface-3);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.theme-seg button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.theme-seg .ts-label{transition:opacity .2s}
.sidebar.collapsed .theme-seg{flex-direction:column;padding:4px}
.sidebar.collapsed .theme-seg button{padding:7px 0;width:100%}
.sidebar.collapsed .ts-label{display:none}

/* user card */
.user-card{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:11px;
  background:var(--surface-2);
  border:1px solid var(--border);
  margin-top:8px;
  transition:background .2s,border-color .2s;
  overflow:hidden;
  min-width:0;
  text-align:left;
  width:100%;
}
.user-card:hover{background:var(--surface-3);border-color:var(--border-2)}
.user-avatar{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;
  display:grid;place-items:center;
  font-family:'Space Grotesk',sans-serif;
  font-size:.78rem;font-weight:700;letter-spacing:-.02em;
  color:#04070c;
  background:var(--grad);
  box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;
  position:relative;
}
.user-avatar::after{
  content:'';position:absolute;right:-2px;bottom:-2px;
  width:10px;height:10px;border-radius:50%;
  background:var(--green);
  border:2px solid var(--surface-2);
}
.user-meta{
  flex:1;min-width:0;overflow:hidden;
  transition:opacity .2s;
}
.user-meta .u-name{
  font-size:.82rem;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.25;
}
.user-meta .u-mail{
  font-size:.7rem;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.3;
}
.user-card .u-caret{
  width:14px;height:14px;flex-shrink:0;
  stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round;
  transition:opacity .2s;
}
.sidebar.collapsed .user-meta,
.sidebar.collapsed .u-caret{opacity:0;width:0}
.sidebar.collapsed .user-card{padding:6px;justify-content:center}
.sidebar.collapsed .user-avatar{width:34px;height:34px}

/* ============================================================
   MAIN
   ============================================================ */
.main{
  flex:1;
  margin-left:var(--sb-w,260px);
  min-width:0;
  transition:margin-left .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
.app.sb-collapsed .main{margin-left:74px}

/* topbar */
.topbar{
  position:sticky;top:0;z-index:40;
  height:64px;
  display:flex;align-items:center;gap:14px;
  padding:0 clamp(16px,3vw,28px);
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter:blur(16px) saturate(180%);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.tb-mobile-toggle{
  display:none;
  width:40px;height:40px;border-radius:10px;
  place-items:center;flex-shrink:0;
  border:1px solid var(--border-2);background:var(--surface);
}
.tb-mobile-toggle svg{width:16px;height:16px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round}

.tb-title{
  font-family:'Space Grotesk',sans-serif;
  font-weight:600;font-size:1.02rem;letter-spacing:-.02em;
  white-space:nowrap;
}
.tb-sub{
  font-size:.76rem;color:var(--dim);
  white-space:nowrap;
}
.tb-title-wrap{display:flex;flex-direction:column;min-width:0;margin-right:auto}

.tb-search{
  position:relative;
  width:clamp(160px,26vw,320px);
  flex-shrink:1;
}
.tb-search input{
  width:100%;
  padding:9px 12px 9px 34px;
  border-radius:10px;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  font-size:.84rem;
  transition:border-color .2s,background .2s;
  min-height:40px;
}
.tb-search input::placeholder{color:var(--dim)}
.tb-search input:focus{outline:none;border-color:var(--border-2);background:var(--surface-3)}
.tb-search svg{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none;
}

.tb-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tb-icon{
  width:40px;height:40px;border-radius:10px;
  display:grid;place-items:center;position:relative;
  border:1px solid var(--border);
  background:var(--surface);
  transition:background .2s,border-color .2s;
}
.tb-icon:hover{background:var(--surface-2);border-color:var(--border-2)}
.tb-icon svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tb-icon .dot{
  position:absolute;top:9px;right:9px;
  width:7px;height:7px;border-radius:50%;
  background:var(--pink);
  box-shadow:0 0 0 2px var(--surface);
}
.tb-cta{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 15px;border-radius:10px;
  background:var(--grad);color:#04070c;
  font-weight:600;font-size:.83rem;
  font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em;
  transition:transform .18s,box-shadow .25s;
  min-height:40px;
  white-space:nowrap;
}
.tb-cta:hover{transform:translateY(-1px);box-shadow:var(--glow)}
.tb-cta svg{width:14px;height:14px;stroke:#04070c;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* content */
.content{
  flex:1;
  padding:clamp(18px,3vw,28px);
  display:flex;flex-direction:column;gap:clamp(16px,2.5vw,22px);
  max-width:1600px;width:100%;
}

/* ============================================================
   KPI CARDS
   ============================================================ */
.kpi-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:clamp(12px,2vw,16px);
}
.kpi{
  position:relative;overflow:hidden;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  display:flex;flex-direction:column;gap:12px;
  transition:border-color .25s,transform .3s;
}
.kpi:hover{border-color:var(--border-2);transform:translateY(-2px)}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.kpi-label{
  font-size:.74rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);
}
.kpi-icon{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  display:grid;place-items:center;
  background:rgba(0,229,192,.1);
  border:1px solid rgba(0,229,192,.18);
}
.kpi-icon svg{width:15px;height:15px;stroke:var(--cyan);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kpi-icon.v{background:rgba(124,92,255,.11);border-color:rgba(124,92,255,.22)}
.kpi-icon.v svg{stroke:var(--violet)}
.kpi-icon.p{background:rgba(255,77,157,.1);border-color:rgba(255,77,157,.2)}
.kpi-icon.p svg{stroke:var(--pink)}
.kpi-icon.a{background:rgba(255,179,107,.1);border-color:rgba(255,179,107,.2)}
.kpi-icon.a svg{stroke:var(--amber)}

.kpi-value{
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(1.55rem,3.4vw,1.9rem);
  font-weight:700;letter-spacing:-.035em;line-height:1;
  display:flex;align-items:baseline;gap:6px;
}
.kpi-value .unit{font-size:.85rem;font-weight:500;color:var(--dim);letter-spacing:0}
.kpi-delta{
  display:inline-flex;align-items:center;gap:4px;
  font-size:.76rem;font-weight:600;
  padding:3px 8px;border-radius:100px;
  background:rgba(61,220,132,.12);color:var(--green);
  width:fit-content;
}
.kpi-delta.down{background:rgba(255,95,109,.12);color:var(--red)}
.kpi-delta svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.kpi-spark{height:36px;margin:0 -4px -4px}

/* ============================================================
   CHART CARDS
   ============================================================ */
.grid{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:clamp(12px,2vw,16px);
}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:clamp(16px,2.4vw,20px);
  display:flex;flex-direction:column;
  min-width:0;
  transition:border-color .25s;
}
.card:hover{border-color:var(--border-2)}
.card-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  margin-bottom:16px;
}
.card-title{
  font-family:'Space Grotesk',sans-serif;
  font-size:.98rem;font-weight:600;letter-spacing:-.02em;
  display:flex;align-items:center;gap:8px;
}
.card-sub{
  font-size:.76rem;color:var(--dim);margin-top:3px;
}
.card-metric{
  font-family:'Space Grotesk',sans-serif;
  font-size:1.28rem;font-weight:700;letter-spacing:-.03em;
  line-height:1;
}
.card-metric small{font-size:.72rem;font-weight:500;color:var(--dim);letter-spacing:0;display:block;margin-top:3px}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 9px;border-radius:100px;
  font-size:.7rem;font-weight:600;
  background:var(--surface-2);color:var(--muted);
  border:1px solid var(--border);
  white-space:nowrap;
}
.chip.live{background:rgba(0,229,192,.1);color:var(--cyan);border-color:rgba(0,229,192,.2)}
.chip .pulse{
  width:6px;height:6px;border-radius:50%;background:var(--cyan);
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(0,229,192,.6)}
  70%{box-shadow:0 0 0 7px rgba(0,229,192,0)}
  100%{box-shadow:0 0 0 0 rgba(0,229,192,0)}
}

.chart-body{flex:1;min-height:0;margin:0 -6px -4px}

/* spans */
.c-8{grid-column:span 8}
.c-4{grid-column:span 4}
.c-6{grid-column:span 6}
.c-3{grid-column:span 3}
.c-12{grid-column:span 12}
.c-5{grid-column:span 5}
.c-7{grid-column:span 7}

@media (max-width:1200px){
  .c-8,.c-4,.c-5,.c-7{grid-column:span 12}
  .c-6,.c-3{grid-column:span 6}
}
@media (max-width:820px){
  .c-6,.c-3{grid-column:span 12}
}

/* ============================================================
   RECHARTS OVERRIDES
   ============================================================ */
.recharts-wrapper{font-size:11px}
.recharts-cartesian-axis-tick text{fill:var(--axis);font-size:11px}
.recharts-cartesian-grid line{stroke:var(--grid)}
.recharts-polar-grid-angle line,
.recharts-polar-grid-concentric path{stroke:var(--grid)}
.recharts-polar-angle-axis-tick text{fill:var(--axis);font-size:10.5px}
.recharts-polar-radius-axis-tick text{fill:var(--dim);font-size:10px}
.recharts-legend-item-text{color:var(--muted)!important;font-size:11.5px}
.recharts-default-legend{font-size:12px}
.recharts-tooltip-cursor{fill:var(--grid)}

.chart-tooltip{
  background:var(--surface-3);
  border:1px solid var(--border-2);
  border-radius:11px;
  padding:10px 12px;
  box-shadow:var(--shadow);
  font-size:.78rem;
  min-width:140px;
}
.chart-tooltip-label{
  font-weight:600;color:var(--text);
  font-size:.76rem;letter-spacing:.02em;
  margin-bottom:7px;
  padding-bottom:7px;
  border-bottom:1px solid var(--border);
}
.chart-tooltip-row{
  display:flex;align-items:center;gap:8px;
  padding:2px 0;
}
.chart-tooltip-dot{
  width:8px;height:8px;border-radius:3px;flex-shrink:0;
}
.chart-tooltip-name{color:var(--muted);flex:1;white-space:nowrap}
.chart-tooltip-value{
  font-weight:600;color:var(--text);
  font-family:'Space Grotesk',sans-serif;
  font-variant-numeric:tabular-nums;
}

/* ============================================================
   TABLE
   ============================================================ */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -6px}
table{width:100%;border-collapse:collapse;min-width:640px}
th{
  text-align:left;
  font-size:.7rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);
  padding:0 12px 11px;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
td{
  padding:13px 12px;
  border-bottom:1px solid var(--border);
  font-size:.85rem;
  color:var(--muted);
  white-space:nowrap;
}

.modal-body{padding:22px;display:flex;flex-direction:column;gap:18px}
.modal-foot{

.field{display:flex;flex-direction:column;gap:7px}

/* ============================================================
   THEME HOOK
   ============================================================ */
function useTheme(){
  const [mode, setMode] = useState(()=> {
    try { return localStorage.getItem('nf-theme') || 'system'; }
    catch(e){ return 'system'; }
  });
  const [resolved, setResolved] = useState('dark');

  useEffect(()=>{
    const root = document.documentElement;
    const apply = (m)=>{
      let r;
      if(m === 'system'){
        r = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } else r = m;
      root.setAttribute('data-theme', r);
      setResolved(r);
    };
    apply(mode);
    try { localStorage.setItem('nf-theme', mode); } catch(e){}

    if(mode === 'system'){
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      const handler = ()=> apply('system');
      if(mq.addEventListener) mq.addEventListener('change', handler);
      else mq.addListener(handler);
      return ()=>{
        if(mq.removeEventListener) mq.removeEventListener('change', handler);
        else mq.removeListener(handler);
      };
    }
  },[mode]);

  return { mode, setMode, resolved };
}

function ChartTooltip({ active, payload, label, formatter }){
  if(!active || !payload || !payload.length) return null;
  return (
    <div className="chart-tooltip">
      {label !== undefined && <div className="chart-tooltip-label">{label}</div>}
      {payload.map((p,i)=>(
        <div key={i} className="chart-tooltip-row">
          <span className="chart-tooltip-dot" style={{background: p.color || p.payload?.fill || 'var(--cyan)'}} />
          <span className="chart-tooltip-name">{p.name}</span>
          <span className="chart-tooltip-value">
            {formatter ? formatter(p.value, p) : (typeof p.value === 'number' ? p.value.toLocaleString() : p.value)}
          </span>
        </div>
      ))}
    </div>
  );
}

/* ============================================================
   PROFILE POPOVER
   ============================================================ */
function ProfilePopover({ anchor, onClose, onBYOK }){
  const ref = useRef(null);
  const [pos, setPos] = useState({bottom:0,left:0});

  useEffect(()=>{
    if(anchor){
      const r = anchor.getBoundingClientRect();
      const W = 240;
      let left = r.left;
      if(left + W > window.innerWidth - 12) left = window.innerWidth - W - 12;
      if(left < 12) left = 12;
      setPos({
        bottom: window.innerHeight - r.top + 10,
        left
      });
    }
  },[anchor]);

  useEffect(()=>{
    if(!anchor) return;
    const onDoc = (e)=>{
      if(ref.current && !ref.current.contains(e.target) && !anchor.contains(e.target)){
        onClose();
      }
    };
    const onEsc = (e)=>{ if(e.key === 'Escape') onClose(); };
    document.addEventListener('mousedown', onDoc);
    document.addEventListener('keydown', onEsc);
    return ()=>{
      document.removeEventListener('mousedown', onDoc);
      document.removeEventListener('keydown', onEsc);
    };
  },[anchor,onClose]);

  if(!anchor) return null;

  return (
    <div className="popover" ref={ref} style={{bottom: pos.bottom, left: pos.left, position:'fixed'}}>
      <div className="pop-head">
        <span className="user-avatar">AR</span>
        <span style={{minWidth:0}}>
          <div className="u-name">Alex Rivera</div>
          <div className="u-mail">alex@nimbusfarm.io</div>
        </span>
      </div>
      <button className="pop-item" onClick={onClose}>{I.user}<span>Profile</span></button>
      <button className="pop-item" onClick={onClose}>{I.settings}<span>Preferences</span></button>
      <button className="pop-item" onClick={()=>{ onBYOK(); onClose(); }}>{I.keys}<span>Bring your own key</span></button>
      <button className="pop-item" onClick={onClose}>{I.billing}<span>Billing &amp; plans</span></button>
      <div className="pop-sep" />
      <button className="pop-item" onClick={onClose}>{I.external}<span>Documentation</span></button>
      <button className="pop-item danger" onClick={onClose}>{I.logout}<span>Sign out</span></button>
    </div>
  );
}

function KPI({ label, value, unit, delta, deltaDir='up', icon, iconClass='', spark, sparkColor }){

  const gradId = `kpi-grad-${label.replace(/\s+/g,'-').toLowerCase()}`;
  return (
    <div className="kpi">
      <div className="kpi-top">

      </div>
      <div className={`kpi-delta ${deltaDir==='down'?'down':''}`}>

              <LineChart data={latencyData} margin={{top:8,right:8,left:-18,bottom:0}}>
                <CartesianGrid strokeDasharray="3 6" vertical={false} />
                <XAxis dataKey="t" {...axisProps} interval={3} />
                <YAxis {...axisProps} width={46} />
                <Tooltip content={<ChartTooltip />} />
                <Legend iconType="circle" iconSize={8} wrapperStyle={{paddingTop:6}} />
                <Line type="monotone" dataKey="p99" name="p99" stroke={p.pink}  strokeWidth={2}   dot={false} activeDot={{r:4}} />
                <Line type="monotone" dataKey="p95" name="p95" stroke={p.amber} strokeWidth={2}   dot={false} activeDot={{r:4}} />
                <Line type="monotone" dataKey="p50" name="p50" stroke={p.cyan}  strokeWidth={2.4} dot={false} activeDot={{r:4}} />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </div>

        <div className="card c-4">
          <div className="card-head">
            <div>
              <div className="card-title">Tasks by region</div>
              <div className="card-sub">Success vs failed · this week</div>
            </div>
          </div>
          <div className="chart-body" style={{height:240}}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={regionData} margin={{top:8,right:8,left:-18,bottom:0}} barCategoryGap="26%">
                <CartesianGrid strokeDasharray="3 6" vertical={false} />
                <XAxis dataKey="region" {...axisProps} />
                <YAxis {...axisProps} width={46} tickFormatter={(v)=> v>=1000 ? `${(v/1000).toFixed(0)}k` : v} />
                <Tooltip content={<ChartTooltip />} cursor={{fill:'transparent'}} />
                <Legend iconType="circle" iconSize={8} wrapperStyle={{paddingTop:6}} />
                <Bar dataKey="tasks"  name="Tasks"  fill={p.cyan}   radius={[5,5,0,0]} maxBarSize={26} />
                <Bar dataKey="failed" name="Failed" fill={p.red}    radius={[5,5,0,0]} maxBarSize={26} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>

        <div className="card c-3">
          <div className="card-head">
            <div>
              <div className="card-title">Success rate</div>
              <div className="card-sub">Last 24 hours</div>
            </div>
          </div>
          <div className="chart-body" style={{height:240, position:'relative'}}>
            <ResponsiveContainer width="100%" height="100%">
              <RadialBarChart
                data={radialData}
                cx="50%"
                cy="50%"
                innerRadius="40%"
                outerRadius="100%"
                startAngle={210}
                endAngle={-30}
              >
                <PolarAngleAxis type="number" domain={[0,100]} tick={false} />
                <RadialBar dataKey="value" background={{fill:'var(--grid)'}} cornerRadius={6} />
                <Tooltip content={<ChartTooltip formatter={(v)=> `${v}%`} />} />
              </RadialBarChart>
            </ResponsiveContainer>
            <div style={{
              position:'absolute', inset:0, display:'grid', placeItems:'center',
              pointerEvents:'none', paddingBottom:18
            }}>
              <div style={{textAlign:'center'}}>
                <div style={{
                  fontFamily:'Space Grotesk, sans-serif', fontSize:'1.7rem',
                  fontWeight:700, letterSpacing:'-.03em', lineHeight:1
                }}>96.4%</div>
                <div style={{fontSize:'.72rem', color:'var(--dim)', marginTop:4}}>SUCCESS</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* Row 3: radar + composed + treemap */}
      <div className="grid">
        <div className="card c-4">
          <div className="card-head">
            <div>
              <div className="card-title">Resource utilization</div>
              <div className="card-sub">Current vs baseline capacity</div>
            </div>
          </div>
          <div className="chart-body" style={{height:280}}>
            <ResponsiveContainer width="100%" height="100%">
              <RadarChart data={radarData} outerRadius="72%">
                <PolarGrid gridType="polygon" />
                <PolarAngleAxis dataKey="metric" />
                <PolarRadiusAxis angle={90} domain={[0,100]} tick={false} axisLine={false} />
                <Tooltip content={<ChartTooltip formatter={(v)=> `${v}%`} />} />
                <Legend iconType="circle" iconSize={8} wrapperStyle={{paddingTop:6}} />
                <Radar name="Current"  dataKey="current"  stroke={p.cyan}   fill={p.cyan}   fillOpacity={0.28} strokeWidth={2} />
                <Radar name="Baseline" dataKey="baseline" stroke={p.violet} fill={p.violet} fillOpacity={0.16} strokeWidth={2} />
              </RadarChart>
            </ResponsiveContainer>
          </div>
        </div>

        <div className="card c-5">
          <div className="card-head">
            <div>
              <div className="card-title">Revenue &amp; fleet growth</div>
              <div className="card-sub">Monthly revenue vs infrastructure cost</div>
            </div>
            <div className="card-metric">
              $632k
              <small>YTD revenue</small>
            </div>
          </div>
          <div className="chart-body" style={{height:280}}>
            <ResponsiveContainer width="100%" height="100%">
              <ComposedChart data={revenueData} margin={{top:8,right:8,left:-14,bottom:0}}>
                <defs>
                  <linearGradient id="gRev" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor={p.violet} stopOpacity={0.4}/>
                    <stop offset="100%" stopColor={p.violet} stopOpacity={0}/>
                  </linearGradient>
                </defs>
                <CartesianGrid strokeDasharray="3 6" vertical={false} />
                <XAxis dataKey="m" {...axisProps} />
                <YAxis {...axisProps} width={52} tickFormatter={(v)=> `$${(v/1000).toFixed(0)}k`} />
                <YAxis yAxisId="right" orientation="right" {...axisProps} width={40} />
                <Tooltip content={<ChartTooltip formatter={(v,n)=> n === 'Devices' ? v.toLocaleString() : `$${v.toLocaleString()}`} />} />
                <Legend iconType="circle" iconSize={8} wrapperStyle={{paddingTop:6}} />
                <Area type="monotone" dataKey="revenue" name="Revenue" stroke={p.violet} strokeWidth={2.2} fill="url(#gRev)" />
                <Bar  dataKey="cost"    name="Cost"    fill={p.amber} radius={[5,5,0,0]} maxBarSize={20} />
                <Line yAxisId="right" type="monotone" dataKey="devices" name="Devices" stroke={p.cyan} strokeWidth={2.2} dot={false} activeDot={{r:4}} />
              </ComposedChart>
            </ResponsiveContainer>
          </div>
        </div>

        <div className="card c-3">
          <div className="card-head">
            <div>
              <div className="card-title">Storage by tenant</div>
              <div className="card-sub">Top consumers · GB</div>
            </div>
          </div>
          <div className="chart-body" style={{height:280}}>
            <ResponsiveContainer width="100%" height="100%">
              <Treemap
                data={treemapData}
                dataKey="size"
                stroke="var(--surface)"
                fill={p.cyan}
                aspectRatio={4/3}
                content={<TreemapCell />}
              >
                <Tooltip content={<ChartTooltip formatter={(v)=> `${v} GB`} />} />
              </Treemap>
            </ResponsiveContainer>
          </div>
        </div>
      </div>

      {/* Row 4: table */}
      <div className="card c-12">
        <div className="card-head">
          <div>
            <div className="card-title">Recent deployments</div>
            <div className="card-sub">Live status across all regions</div>
          </div>
          <button className="btn btn-ghost" style={{minHeight:36, padding:'8px 14px', fontSize:'.82rem'}}>
            View all
          </button>
        </div>
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Deployment</th>
                <th>Status</th>
                <th>Devices</th>
                <th>Success</th>
                <th>Latency</th>
                <th>Started</th>
              </tr>
            </thead>
            <tbody>
              {deployments.map(d => (
                <tr key={d.id}>
                  <td className="strong">
                    <div className="dev-cell">
                      <span className={`dev-dot ${d.status}`} />
                      <div>
                        <div>{d.name}</div>
                        <div className="mono" style={{color:'var(--dim)', fontSize:'.72rem'}}>{d.id}</div>
                      </div>
                    </div>
                  </td>
                  <td>
                    <span className={`pill ${d.status === 'online' ? 'green' : d.status === 'busy' ? 'amber' : 'gray'}`}>
                      {d.status}
                    </span>
                  </td>
                  <td className="mono">{d.devices}</td>
                  <td><span className="pill cyan">{d.success}</span></td>
                  <td className="mono">{d.latency}</td>
                  <td style={{color:'var(--dim)'}}>{d.started}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
}

/* ============================================================
   TREEMAP CELL
   ============================================================ */
function TreemapCell(props){
  const { x, y, width, height, name, size, fill } = props;
  if(width < 4 || height < 4) return null;
  const showLabel = width > 58 && height > 30;
  return (
    <g>
      <rect
        x={x} y={y} width={width} height={height}
        style={{
          fill, stroke:'var(--surface)', strokeWidth:2,
          fillOpacity:.82
        }}
        rx={5}
      />
      {showLabel && (
        <>
          <text
            x={x + 8} y={y + 18}
            fill="#04070c" fontSize="11" fontWeight="700"
            fontFamily="Space Grotesk, sans-serif"
          >{name}</text>
          <text
            x={x + 8} y={y + 32}
            fill="rgba(4,7,12,.7)" fontSize="10"
            fontFamily="Inter, sans-serif"
          >{size} GB</text>
        </>
      )}
    </g>
  );
}

/* ============================================================
   PLACEHOLDER VIEW
   ============================================================ */
function PlaceholderView({ label }){
  return (
    <div className="card c-12" style={{minHeight:'60vh', display:'grid', placeItems:'center', textAlign:'center'}}>
      <div>
        <div style={{
          width:64, height:64, borderRadius:18, margin:'0 auto 20px',
          background:'var(--surface-2)', border:'1px solid var(--border)',
          display:'grid', placeItems:'center'
        }}>
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/>
          </svg>
        </div>
        <div style={{fontFamily:'Space Grotesk, sans-serif', fontSize:'1.1rem', fontWeight:600, letterSpacing:'-.02em'}}>
          {label}
        </div>
        <div style={{color:'var(--dim)', fontSize:'.85rem', marginTop:6, maxWidth:'36ch'}}>
          This section is part of the demo. Switch back to <strong style={{color:'var(--muted)'}}>Dashboard</strong> to explore the charts.
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App(){
  const { mode, setMode, resolved } = useTheme();
  const palette = usePalette(resolved);

  const [collapsed, setCollapsed] = useState(()=> {
    try { return localStorage.getItem('nf-sb') === '1'; }
    catch(e){ return false; }
  });
  const [mobileOpen, setMobileOpen] = useState(false);
  const [active, setActive] = useState('dashboard');
  const [byokOpen, setByokOpen] = useState(false);
  const [profileAnchor, setProfileAnchor] = useState(null);

  const profileRef = useRef(null);

  useEffect(()=>{
    try { localStorage.setItem('nf-sb', collapsed ? '1' : '0'); } catch(e){}
  },[collapsed]);

  // close mobile drawer on resize to desktop
  useEffect(()=>{
    const onResize = ()=>{
      if(window.innerWidth > 1024) setMobileOpen(false);
    };
    window.addEventListener('resize', onResize);
    return ()=> window.removeEventListener('resize', onResize);
  },[]);

  // close profile popover on scroll/resize
  useEffect(()=>{
    if(!profileAnchor) return;
    const close = ()=> setProfileAnchor(null);
    window.addEventListener('resize', close);
    window.addEventListener('scroll', close, true);
    return ()=>{
      window.removeEventListener('resize', close);
      window.removeEventListener('scroll', close, true);
    };
  },[profileAnchor]);

  const titles = {
    dashboard: { t:'Dashboard', s:'Fleet overview · last 30 days' },
    analytics: { t:'Analytics', s:'Deep-dive metrics' },
    activity:  { t:'Activity',  s:'Live event stream' },
    devices:   { t:'Devices',   s:'1,284 cloud phones' },
    automate:  { t:'Automations', s:'Scripts & schedules' },
    proxies:   { t:'Proxies',   s:'Residential & mobile' },
    team:      { t:'Team',      s:'Members & roles' },
    keys:      { t:'API Keys',  s:'Access tokens' },
    logs:      { t:'Logs',      s:'System events' },
  };
  const meta = titles[active] || { t:'Dashboard', s:'' };

  const navLabel = useMemo(()=>{
    for(const g of NAV) for(const it of g.items) if(it.id === active) return it.label;
    return 'Dashboard';
  },[active]);

  return (
    <div className={`app ${collapsed ? 'sb-collapsed' : ''}`}>
      <Sidebar
        collapsed={collapsed} setCollapsed={setCollapsed}
        mobileOpen={mobileOpen} setMobileOpen={setMobileOpen}
        active={active} setActive={setActive}
        theme={mode} setTheme={setMode}
        onBYOK={()=>setByokOpen(true)}
        onProfileClick={()=>{
          setProfileAnchor(a => a ? null : profileRef.current);
        }}
        profileRef={profileRef}
      />

      <div className="main">
        <Topbar
          onMobileMenu={()=>setMobileOpen(true)}
          title={meta.t}
          subtitle={meta.s}
        />

        <div className="content">
          {active === 'dashboard'
            ? <Dashboard palette={palette} />
            : <div className="grid"><PlaceholderView label={navLabel} /></div>
          }
        </div>
      </div>

      <ProfilePopover
        anchor={profileAnchor}
        onClose={()=>setProfileAnchor(null)}
        onBYOK={()=>setByokOpen(true)}
      />

      <BYOKModal open={byokOpen} onClose={()=>setByokOpen(false)} />
    </div>
  );
}

createRoot(document.getElementById('root')).render(<App />);
</script>

<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
