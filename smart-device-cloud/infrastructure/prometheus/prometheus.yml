global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:3000"]
    metrics_path: /metrics

  - job_name: billing-service
    static_configs:
      - targets: ["billing-service:3005"]
    metrics_path: /metrics

  - job_name: mcp
    static_configs:
      - targets: ["mcp:3004"]
    metrics_path: /metrics

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
