version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: smartcloud-postgres-dev
    environment:
      POSTGRES_USER: smartcloud
      POSTGRES_PASSWORD: smartcloud_password
      POSTGRES_DB: smart_device_cloud
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartcloud-dev

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: smartcloud-timescaledb-dev
    environment:
      POSTGRES_USER: smartcloud
      POSTGRES_PASSWORD: smartcloud_password
      POSTGRES_DB: smart_device_telemetry
    ports:
      - "5433:5432"
    volumes:
      - timescaledb-dev-data:/var/lib/postgresql/data
      - ./docker/timescaledb-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartcloud-dev

  redis:
    image: redis:7-alpine
    container_name: smartcloud-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartcloud-dev

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: smartcloud-elasticsearch-dev
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-dev-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartcloud-dev

  minio:
    image: minio/minio:latest
    container_name: smartcloud-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-dev-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - smartcloud-dev

  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: smartcloud-jaeger-dev
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - smartcloud-dev

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: smartcloud-prometheus-dev
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-dev-data:/prometheus
    networks:
      - smartcloud-dev

  grafana:
    image: grafana/grafana:10.1.0
    container_name: smartcloud-grafana-dev
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-dev-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - smartcloud-dev

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: smartcloud-otel-dev
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    networks:
      - smartcloud-dev

  nginx:
    image: nginx:alpine
    container_name: smartcloud-nginx-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api-gateway
    networks:
      - smartcloud-dev

volumes:
  postgres-dev-data:
  timescaledb-dev-data:
  redis-dev-data:
  elasticsearch-dev-data:
  minio-dev-data:
  prometheus-dev-data:
  grafana-dev-data:

networks:
  smartcloud-dev:
    name: smartcloud-dev-network
