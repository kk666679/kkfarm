apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-agent
  namespace: smart-device-cloud
  labels:
    app.kubernetes.io/name: device-agent
    app.kubernetes.io/part-of: smart-device-cloud
    app.kubernetes.io/component: device-agent
spec:
  replicas: 5
  selector:
    matchLabels:
      app: device-agent
  template:
    metadata:
      labels:
        app: device-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: device-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: device-agent
          image: sdc/device-agent:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 9090
              name: grpc
          envFrom:
            - secretRef:
                name: sdc-secrets
            - configMapRef:
                name: sdc-config
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: GRPC_PORT
              value: "9090"
            - name: API_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: sdc-config
                  key: api-gateway.url
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: sdc-config
                  key: redis.host
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - device-agent
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: device-agent
  namespace: smart-device-cloud
  labels:
    app: device-agent
spec:
  type: ClusterIP
  selector:
    app: device-agent
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: device-agent
  namespace: smart-device-cloud
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: device-agent
  minReplicas: 5
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0
