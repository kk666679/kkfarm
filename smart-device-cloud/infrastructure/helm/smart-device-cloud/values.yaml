global:
  imageRegistry: ""
  imagePullSecrets: []
  imageTag: "latest"
  environment: "production"
  domain: "sdc.example.com"
  monitoring:
    enabled: true
    prometheusUrl: "http://prometheus:9090"
    grafanaUrl: "http://grafana:3000"
  logging:
    level: "info"
    format: "json"
  tracing:
    enabled: true
    jaegerUrl: "http://jaeger:16686"

apiGateway:
  enabled: true
  replicaCount: 3
  image:
    repository: sdc/api-gateway
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
    grpcPort: 9090
  ingress:
    enabled: true
    className: nginx
    host: api.sdc.example.com
    tls:
      enabled: true
      secretName: api-gateway-tls
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    NODE_ENV: production
    LOG_LEVEL: info
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001
  securityContext:
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

telemetryService:
  enabled: true
  replicaCount: 3
  image:
    repository: sdc/telemetry-service
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
    grpcPort: 9090
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  autoscaling:
