ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  tls:
    - secretName: sdc-tls
      hosts:
        - api.sdc.example.com
        - mcp.sdc.example.com

serviceAccounts:
  create: true
  annotations: {}

rbac:
  create: true

networkPolicies:
  enabled: true

podDisruptionBudgets:
  enabled: true
  minAvailable: 1

serviceMonitors:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s

commonLabels:
  app.kubernetes.io/managed-by: helm

commonAnnotations: {}
