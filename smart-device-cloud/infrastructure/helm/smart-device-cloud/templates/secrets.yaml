apiVersion: v1
kind: Secret
metadata:
  name: sdc-secrets
  namespace: { { .Release.Namespace } }
  labels:
    app.kubernetes.io/managed-by: { { .Release.Service } }
    app.kubernetes.io/instance: { { .Release.Name } }
type: Opaque
stringData:
  postgres.password: { { .Values.global.postgresPassword | default "" } }
  timescaledb.password: { { .Values.global.timescaledbPassword | default "" } }
  redis.password: { { .Values.global.redisPassword | default "" } }
  elasticsearch.password: { { .Values.global.elasticsearchPassword | default "" } }
  kafka.sasl.username: { { .Values.global.kafkaSaslUsername | default "" } }
  kafka.sasl.password: { { .Values.global.kafkaSaslPassword | default "" } }
  stripe.apiKey: { { .Values.global.stripeApiKey | default "" } }
  jwt.secret: { { .Values.global.jwtSecret | default "" } }
  minio.accessKey: { { .Values.global.minioAccessKey | default "" } }
  minio.secretKey: { { .Values.global.minioSecretKey | default "" } }
