apiVersion: v1
kind: ConfigMap
metadata:
  name: sdc-config
  namespace: { { .Release.Namespace } }
  labels:
    app.kubernetes.io/managed-by: { { .Release.Service } }
    app.kubernetes.io/instance: { { .Release.Name } }
data:
  postgres.host: { { include "postgres.host" . } }
  postgres.port: "5432"
  timescaledb.host: { { include "timescaledb.host" . } }
  timescaledb.port: "5432"
  redis.host: { { include "redis.host" . } }
  redis.port: "6379"
  elasticsearch.host: { { include "elasticsearch.host" . } }
  elasticsearch.port: "9200"
  kafka.brokers: { { include "kafka.brokers" . } }
  api-gateway.url: http://api-gateway.{{ .Release.Namespace }}.svc.cluster.local
  minio.endpoint: { { include "minio.endpoint" . } }
